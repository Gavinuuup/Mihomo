name: Convert YAML <-> List

on:
  workflow_run:
    workflows:
      - "Merge Rules"
      - "Convert Mihomo Rules to MRS"
    types:
      - completed

  push:
    paths:
      - "rules/domain/AI.list"
      - "rules/domain/Proxy.list"
      - "rules/domain/cn.list"
      - "rules/domain/Streaming-cn.list"
      - "rules/ip/AI.list"
      - "rules/ip/cn.list"
      - ".github/workflows/yaml_to_list.py"
      - ".github/workflows/yaml-to-list.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-push
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install pyyaml

      - name: Convert all pairs
        run: |
          set -e
          while IFS='|' read -r type in out; do
            type=$(echo "$type" | tr -d '\r')
            in=$(echo "$in" | tr -d '\r')
            out=$(echo "$out" | tr -d '\r')
            [ -z "$type" ] && continue

            echo "===== [$type] $in -> $out ====="
            python .github/workflows/yaml_to_list.py "$type" "$in" "$out"
          done <<'EOF'
          domain|rules/domain/AI.list|rules/AI.yaml
          domain|rules/domain/Proxy.list|rules/Proxy.yaml
          domain|rules/domain/cn.list|rules/cn.yaml
          domain|rules/domain/Streaming-cn.list|rules/Streaming-cn.yaml
          ipcidr|rules/ip/AI.list|rules/AI-ip.yaml
          ipcidr|rules/ip/cn.list|rules/cn-ip.yaml
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/AI.yaml rules/Proxy.yaml rules/cn.yaml rules/Streaming-cn.yaml rules/AI-ip.yaml rules/cn-ip.yaml
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "chore: rebuild converted rules [$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push ok"
              exit 0
            fi
            echo "push failed, retry $i ..."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "push failed after retries"
          exit 1

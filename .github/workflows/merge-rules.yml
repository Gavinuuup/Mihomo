name: Merge Rules

on:
  push:
    paths:
      - "rules/merge/ChinaMax_Domain.yaml"
      - "rules/merge/ChinaMax_IP.yaml"
      - "rules/merge/DirectFix.yaml"
      - "rules/merge/Direct_IPFix.yaml"
      - "rules/merge/AI.txt"
      - "rules/merge/AIFix.yaml"
      - "rules/merge/AI-IP.yaml"
      - "rules/merge/AI-IPFix.yaml"
      - ".github/workflows/merge_rules.py"
      - ".github/workflows/merge-rules.yml"

  workflow_run:
    workflows: ["Sync Mihomo Rule"]
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rules-push
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install pyyaml

      - name: Merge all rule sets
        run: |
          set -e
          while IFS='|' read -r name base custom out; do
            # 过滤掉可能的 Windows 回车符和空白
            name=$(echo "$name" | tr -d '\r')
            base=$(echo "$base" | tr -d '\r')
            custom=$(echo "$custom" | tr -d '\r')
            out=$(echo "$out" | tr -d '\r')
            
            # 跳过空行
            [ -z "$name" ] && continue

            echo "===== Merge $name ====="
            python .github/workflows/merge_rules.py \
              "$name" Gavinuuup "$base" "$custom" "$out"
          done <<'EOF'
          Direct|rules/merge/ChinaMax_Domain.yaml|rules/merge/DirectFix.yaml|rules/domain/Direct.yaml
          Direct_IP|rules/merge/ChinaMax_IP.yaml|rules/merge/Direct_IPFix.yaml|rules/ip/Direct_IP.yaml
          AI|rules/merge/AI.txt|rules/merge/AIFix.yaml|rules/domain/AI.yaml
          AI_IP|rules/merge/AI-IP.yaml|rules/merge/AI-IPFix.yaml|rules/ip/AI.yaml
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/domain/Direct.yaml rules/ip/Direct_IP.yaml rules/domain/AI.yaml rules/ip/AI.yaml
          if git diff --cached --quiet; then
            echo "No merged change"
            exit 0
          fi
          git commit -m "chore: rebuild rules [$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push ok"
              exit 0
            fi
            echo "push failed, retry $i ..."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "push failed after retries"
          exit 1
